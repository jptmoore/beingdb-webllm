# Publish the chatbot over the REWIND facts on GitHub Pages:
# https://jptmoore.github.io/beingdb-webllm/
#
# Uses BeingDB WASM's committed prebuilt runtime and REWIND data (no OCaml),
# runs the model-free tests, builds dist/site/ and deploys it. Pull requests
# build and test only.
#
# One-time repository setting: Settings > Pages > Build and deployment >
# Source: "GitHub Actions".
name: Chatbot site (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BEINGDB_WASM_REF: main

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check out BeingDB WASM next to this repository
        run: |
          git init -q ../beingdb-wasm
          git -C ../beingdb-wasm fetch -q --depth 1 https://github.com/jptmoore/beingdb-wasm.git "$BEINGDB_WASM_REF"
          git -C ../beingdb-wasm checkout -q FETCH_HEAD

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci
      - run: npm run link
      - run: npm test
      - run: npm run build:site

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
